[project]
name = "dulaingo-teacher"
version = "0.1.0"
description = "AI language teacher voice agent for Dulaingo — OpenAI Realtime over Stream Edge"
requires-python = ">=3.12"
dependencies = [
    "vision-agents[getstream,openai]",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["agent.py", "instructions.md"]
